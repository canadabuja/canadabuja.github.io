function pct(x,b){
 const pts=[[0,0],[b[0],25],[b[1],50],[b[2],75],[b[3],90]];
 if(x>=b[3]) return Math.min(99,90+Math.log2(x/b[3])*8);
 for(let k=1;k<pts.length;k++){const [x0,p0]=pts[k-1],[x1,p1]=pts[k];if(x<=x1){if(x0===0)return p1*x/x1;return p0+(p1-p0)*Math.log(x/x0)/Math.log(x1/x0)}}
}

 const F={SCORE:R.tot,TYPE:R.type,WEAK:R.weak,TODO1:R.plan[0]||'',TODO2:R.plan[1]||'',TODO3:R.plan[2]||'',RLINK:link,
  SPEND:R.sc.spend+'/'+R.cnt.spend+' '+R.lvl.spend,SAVE:R.sc.save+'/'+R.cnt.save+' '+R.lvl.save,CREDIT:R.sc.credit+'/'+R.cnt.credit+' '+R.lvl.credit,INVEST:R.sc.invest+'/'+R.cnt.invest+' '+R.lvl.invest};
 btn.disabled=true;btn.textContent='보내는 중…';
 // 1) 결과 리포트 메일 (요청한 1통)
 try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({kind:'report',email:em,f:F})}).catch(()=>{})}catch(e){}
 // 2) 뉴스레터 동의한 경우에만 Mailchimp 명단에 추가
 if(ok&&MC.u){const cb='mc'+Date.now();window[cb]=()=>{delete window[cb]};
  const q=Object.entries(Object.assign({EMAIL:em,NEWS:'yes'},F)).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
  const sc=document.createElement('script');sc.src=`https://${MC.host}/subscribe/post-json?u=${MC.u}&id=${MC.id}&f_id=${MC.f}&${q}&c=${cb}`;document.body.appendChild(sc)}
 setTimeout(()=>{btn.textContent='보냈어요';show('몇 분 안에 <b>'+em.replace(/[<>&]/g,'')+'</b>로 리포트가 도착해요. 안 보이면 스팸함이나 프로모션함도 확인해 주세요.'+(ok?' 뉴스레터 신청도 완료됐어요.':'')+'<br><a href="'+link+'">상세 리포트 바로 보기 →</a>')},900);
}

function result(report){
 const sc={},cnt={};AREAS.forEach(a=>{sc[a.k]=0;cnt[a.k]=0});const flags=[];
 Q.forEach((q,n)=>{cnt[q[0]]+=4;if(pick[n]==null)return;const o=q[3][pick[n]];sc[q[0]]+=o[1];if(o[2])flags.push(o[2])});
 const r=k=>sc[k]/cnt[k];
 const tot=Math.round(Object.values(sc).reduce((s,v)=>s+v,0)/Object.values(cnt).reduce((s,v)=>s+v,0)*100);
 const key=((sc.spend+sc.credit)/(cnt.spend+cnt.credit)>=.65?'1':'0')+(r('save')>=.65?'1':'0')+(r('invest')>=.65?'1':'0');
 const T=TYPES[key];
 if(!report) saveRecord({v:'1',tot,type:T[1],s:Object.fromEntries(AREAS.map(a=>[a.k,sc[a.k]])),age:prof.age||'',inc:prof.inc_n??'',yrs:prof.yrs||'',a:pick.map((v,n)=>v==null?null:(n+1)+':'+v).filter(Boolean).join(' ')});
 const lvl=k=>r(k)>=.75?0:r(k)>=.45?1:2;
 const pills=[['g','튼튼'],['m','보통'],['b','점검 필요']];
 const col=['var(--good)','var(--mid)','var(--bad)'];
 const areasHtml=AREAS.map(a=>{const l=lvl(a.k);return `<div class="area"><div class="name">${a.name}</div><div class="meter"><i style="width:${r(a.k)*100}%;background:${col[l]}"></i></div><span class="pill ${pills[l][0]}">${sc[a.k]}/${cnt[a.k]}</span><div class="amsg"><b class="${pills[l][0]}" style="background:none;padding:0">${pills[l][1]}</b> · ${MSG[a.k][l]}</div></div>`}).join('');
 const weak=[...AREAS].sort((a,b)=>r(a.k)-r(b.k));
 const recs=flags.includes('deficit')?[3,4,10]:[];weak.forEach(a=>{if(lvl(a.k)>0)a.steps.forEach(s=>{if(recs.length<3&&!recs.includes(s)&&recs.filter(x=>a.steps.includes(x)).length<2)recs.push(s)})});
 if(recs.length<3)[18,21,22].forEach(s=>{if(recs.length<3&&!recs.includes(s))recs.push(s)});
 const notes=flags.sort((a,b)=>(b==='deficit')-(a==='deficit')).map(f=>FLAGS[f]);
 if(prof.yrs==='new')notes.unshift('<b>캐나다에 온 지 3년이 안 됐어요.</b> 지금 만드는 신용 기록과 TFSA 한도 확인이 앞으로 몇 년을 좌우해요. 1단계부터 순서대로 보시면 놓치는 게 없어요.');
 let cmp='';
 if(prof.age&&prof.inc){
  const b=BANDS[prof.age],inc=prof.inc,p=Math.round(pct(inc,b)),top=Math.max(1,Math.round((100-p)/5)*5)||1;
  const W=320,H=70,max=b[3]*1.5,X=v=>16+Math.min(v,max)/max*(W-32);
  const ticks=[[b[0],'하위 25%'],[b[1],'중간'],[b[2],'상위 25%'],[b[3],'상위 10%']];
  cmp=`<div class="card"><h2>캐나다 사람들과 비교하면</h2>
   <div class="big">같은 나이대 중<br>소득 <em>상위 약 ${top}%</em></div>
   <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="같은 나이대 소득 분포에서 내 위치">
    <line x1="16" y1="30" x2="${W-16}" y2="30" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/>
    ${ticks.map(t=>`<line x1="${X(t[0])}" y1="22" x2="${X(t[0])}" y2="38" stroke="var(--muted)" stroke-width="2"/><text x="${X(t[0])}" y="56" text-anchor="middle">${t[1]}</text>`).join('')}
    <circle cx="${X(inc)}" cy="30" r="9" fill="var(--accent)" stroke="var(--fg)" stroke-width="2"/><text x="${X(inc)}" y="12" text-anchor="middle" style="fill:var(--fg);font-weight:700">나</text>
   </svg></div>
   <p class="fine">같은 나이대 중간 소득은 $${b[1].toLocaleString()}이에요. 캐나다 통계청 2023년 납세자 자료(개인 세전 총소득) 기준이고, 중간값 외의 구간은 추정치예요.</p></div>`;
 }
 if(pick[Q.findIndex(q=>q[1].startsWith('신용카드 대금'))]===0) cmp+=`<div class="card"><h2>이 습관은 상위권이에요</h2><p>카드를 매달 전액 갚는 습관, 생각보다 흔하지 않아요. 캐나다인 <b>4명 중 1명</b>은 카드 최소 금액만 갚을 거라고 답했어요.</p><p class="fine">Equifax Canada 조사, 2026</p></div>`;

 const detail=report?`<div class="card"><h2>분야별 상세</h2><p class="fine">점수가 낮은 분야부터 정리했어요.</p>${weak.map((a,j)=>{const l=lvl(a.k);
   const mine=Q.map((q,n)=>q[0]===a.k&&vis(n)&&pick[n]!=null?q[3][pick[n]][0]:null).filter(Boolean);
   const st=a.steps.filter(x=>STEPS[x]).slice(0,2);
   return `<div class="dt${j===0&&l>0?' first':''}"><div class="dh"><b>${a.name}</b>${j===0&&l>0?'<span class="flag">먼저 손볼 곳</span>':''}<span class="pill ${pills[l][0]}">${pills[l][1]} ${sc[a.k]}/${cnt[a.k]}</span></div>
    <div class="lab">내 답 요약</div><p class="fine">${mine.join(' · ')}</p>
    <div class="lab">왜 중요한가요</div><p>${WHY[a.k]}</p>
    <div class="lab">내가 할 일</div><ol class="todo">${TODO[a.k][l].map(t=>`<li>${t}</li>`).join('')}</ol>
    <p class="fine">관련 영상 ${st.map(x=>`<a href="${YT(STEPS[x][1])}" target="_blank" rel="noopener">${x}단계 ${STEPS[x][0]} →</a>`).join(' · ')}</p></div>`}).join('')}</div>`:'';
 const plan=weak.filter(a=>lvl(a.k)>0).slice(0,2).map(a=>TODO[a.k][lvl(a.k)][0]);
 if(plan.length<3)weak.forEach(a=>TODO[a.k][lvl(a.k)].forEach(t=>{if(plan.length<3&&!plan.includes(t))plan.push(t)}));
 window.__R={tot,type:T[1],weak:weak[0].name,plan,code:enc(),sc,cnt,lvl:Object.fromEntries(AREAS.map(a=>[a.k,pills[lvl(a.k)][1]]))};
 app.innerHTML=head+`
 ${report?'<p class="fine" style="margin:0">상세 리포트</p>':''}
 <div class="card">
  <div class="fine">나의 돈 습관 유형</div>
  <div class="typename">${T[1]}</div>
  <div class="fine">내 재무 건강 점수</div>
  <div class="score">${tot}<small> / 100</small></div>
  <p>${T[2]}</p>
  <p class="insight">${T[3]}</p>
 </div>
 <div class="card"><h2>분야별 상태</h2>${areasHtml}</div>
 ${detail}
 ${notes.length?`<div class="card"><h2>내 답에서 보이는 것</h2><ul class="notes">${notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`:''}
 ${cmp}
 <div class="card"><h2>먼저 보면 좋은 영상</h2><div class="steps">${recs.map(s=>`<a href="${YT(STEPS[s][1])}" target="_blank" rel="noopener">${s}단계 · ${STEPS[s][0]}<span>보기 →</span></a>`).join('')}</div></div>
 ${report?`<div class="card"><h2>30일 동안 내가 할 일</h2><ol class="todo">${plan.map(t=>`<li>${t}</li>`).join('')}</ol><p class="fine">3개월 뒤에 같은 테스트를 다시 해 보면 점수가 얼마나 바뀌었는지 볼 수 있어요.</p></div>`:`<div class="card"><h2>상세 리포트 받기</h2>
  <p class="fine">분야별로 무엇부터 바꾸면 좋을지, 30일 동안 할 일까지 정리해서 이메일로 보내 드려요.</p>
  <form id="f" style="display:flex;flex-direction:column;gap:12px">
   <input type="email" id="email" required placeholder="이메일 주소" autocomplete="email" aria-label="이메일 주소">
   <label for="consent"><input type="checkbox" id="consent">캐나다 부자로 살기의 뉴스레터(돈 공부 팁, 새 영상 소식)도 받을게요. 언제든 수신 거부할 수 있어요.</label>
   <button class="primary" type="submit" id="sb">리포트 받기</button>
  </form>
  <div id="sent" hidden class="note" aria-live="polite"></div>
 </div>`}
 <button class="ghost" id="again">처음부터 다시 하기</button>
 <p class="fine">교육 목적의 일반 정보이며 투자 조언이 아니에요. 답변은 이름이나 이메일 없이 통계용으로만 저장되고, 이메일은 리포트와 뉴스레터(동의한 경우) 발송에만 써요.</p>`;
 const f=document.getElementById('f');if(f)f.onsubmit=e=>{e.preventDefault();subscribe()};
 document.getElementById('again').onclick=()=>{history.replaceState(null,'',location.pathname);intro()};
 window.scrollTo(0,0);
}
if(location.hash.startsWith('#r=')){try{dec(decodeURIComponent(location.hash.slice(3)));result(true)}catch(e){intro()}}else intro();
</script>
